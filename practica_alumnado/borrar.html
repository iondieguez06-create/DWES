<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="cont">
    <h1 id="tituloPrincipal">Eliminar mis datos</h1>
    <p>Introduce tu correo electrónico y contraseña para suprimir tu información del sistema.</p>

    <form class="login-form" action="borrar.php" method="POST">
      <label for="mail">Correo electrónico:</label>
      <input type="email" id="mail" name="correo" required>

      <label for="clave">Clave de acceso:</label>
      <input type="password" id="clave" name="contrasena" required>

      <button type="submit">Eliminar</button>
    </form>

    <hr>

    <a href="eleccion.html"><button id="boton">Regresar</button></a>
  </div>
</body>
</html>
