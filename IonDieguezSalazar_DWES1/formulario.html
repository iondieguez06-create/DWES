<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="cont layout">
        <!-- Barra superior con Volver y título -->
        <div class="barra">
            <a href="eleccion.html"><button id="boton">Volver</button></a>
            <h1>Crear cuenta</h1>
        </div>

        <form class="login-form ficha panel" method="POST" action="registro.php">             
            <div class="grid">
                <div class="col izq">
                    <label for="fld_nombre">Nombre Del producto</label>
                    <input id="fld_nombre" type="text" name="nombre_producto" required>

                    <label for="fld_stock">Stock Del Producto</label>
                    <input id="fld_stock" type="number" name="stock_producto" required>

                    <label for="fld_compra">Precio de compra</label>
                    <input id="fld_compra" type="number" name="precio_compra" required>

                    <label for="fld_venta">Precio de venta</label>
                    <input id="fld_venta" type="number" name="precio_venta" required>
                </div>
            </div>
            <div class="acciones">
                <button type="submit">Enviar producto</button>
            </div>
        </form>
    </div>
</body>
</html>
